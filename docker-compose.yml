# ============================================================
#  TempsFlow — Docker Compose
#  Run all 3 services: frontend, backend, database
#
#  Usage:
#    docker compose up --build        (first time)
#    docker compose up -d             (background)
#    docker compose down              (stop)
#    docker compose down -v           (stop + delete DB volume)
# ============================================================

version: '3.9'

services:

  # ----------------------------------------------------------
  #  DATABASE — MySQL 8.0
  # ----------------------------------------------------------
  database:
    build:
      context: ./Database
    container_name: tempsflow_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: tempsflow
      TZ: UTC
    command: --default-time-zone='+00:00'
    ports:
      - "3307:3306"       # expose to host for tools like DBeaver/MySQL Workbench
    volumes:
      - db_data:/var/lib/mysql   # persist data across restarts
    networks:
      - tempsflow_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  #  BACKEND — Node.js + Express API
  # ----------------------------------------------------------
  backend:
    build:
      context: ./Backend
    container_name: tempsflow_api
    restart: unless-stopped
    environment:
      MYSQL_HOST: database
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy   # wait for DB to be ready
    networks:
      - tempsflow_network

  # ----------------------------------------------------------
  #  FRONTEND — nginx serving static files
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
    container_name: tempsflow_ui
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - tempsflow_network

# ----------------------------------------------------------
#  VOLUMES & NETWORKS
# ----------------------------------------------------------
volumes:
  db_data:
    driver: local

networks:
  tempsflow_network:
    driver: bridge